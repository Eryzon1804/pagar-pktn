<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAGAR PKTN - Pengawasan Barang SNI</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Tailwind CSS untuk Desain Rapi -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    // Pendaftaran Service Worker untuk Offline Mode Total
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered!'))
        .catch(err => console.log('SW Registration Failed:', err));
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <div class="max-w-2xl mx-auto p-4 sm:p-6 my-6 bg-white rounded-2xl shadow-lg border border-slate-100">
    
    <!-- Header & Status Koneksi -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
      <div>
        <h1 class="text-xl font-bold text-blue-600">PAGAR PKTN</h1>
        <p class="text-xs text-slate-500">Pengawasan Barang SNI</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="networkStatus" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-700">🟢 Online</span>
        <button onclick="bukaMenuOffline()" id="offlineBadge" class="hidden px-2.5 py-1 text-xs font-semibold rounded-full bg-amber-100 text-amber-800 hover:bg-amber-200 transition">
          📦 Offline: 0
        </button>
      </div>
    </div>

    <!-- Form Utama -->
    <form id="pengawasanForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Usaha</label>
        <input type="text" id="namaUsaha" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Pemilik</label>
        <input type="text" id="namaPemilik" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Telepon Pemilik</label>
        <input type="tel" id="teleponPemilik" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Koordinat Lokasi</label>
        <input type="text" id="koordinat" placeholder="Contoh: -6.2088, 106.8456" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Barang</label>
          <input type="text" id="jenisBarang" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Merk Barang</label>
          <input type="text" id="merkBarang" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Negara Pembuat</label>
        <input type="text" id="negaraPembuat" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Foto Barang / No SNI</label>
          <input type="file" id="fileNoSni" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Foto Kemasan</label>
          <input type="file" id="fileKemasan" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
      </div>

      <!-- Tombol Kirim -->
      <button type="submit" id="btnSubmit" class="w-full mt-6 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition text-sm">
        🚀 Kirim Data & Buat Laporan Word
      </button>

    </form>
  </div>

  <!-- Modal / Notifikasi -->
  <div id="modalAlert" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-xl">
      <h3 id="modalTitle" class="text-lg font-bold">Judul</h3>
      <p id="modalMessage" class="text-sm text-slate-600">Pesan...</p>
      <button onclick="tutupModal()" class="w-full py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Tutup</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbw4n62486kuLOxa9uMWb3DIjOG3Gi0JaWrlz2pE3g-JshlhNoeiy5m3mYNUXRs-vFjK/exec";

    // Cek Status Jaringan Real-time
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function updateOnlineStatus() {
      const statusEl = document.getElementById('networkStatus');
      if (navigator.onLine) {
        statusEl.textContent = "🟢 Online";
        statusEl.className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-700";
        sinkronisasiDataOtomatis();
      } else {
        statusEl.textContent = "🔴 Offline";
        statusEl.className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-rose-100 text-rose-700";
      }
      cekDataOffline();
    }

    function cekDataOffline() {
      let dataOffline = JSON.parse(localStorage.getItem('queue_pengawasan') || '[]');
      let badge = document.getElementById('offlineBadge');
      if (dataOffline.length > 0) {
        badge.classList.remove('hidden');
        badge.textContent = `📦 Offline: ${dataOffline.length}`;
      } else {
        badge.classList.add('hidden');
      }
    }

    // Konversi File ke Base64 agar aman dikirim ke Apps Script
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          name: file.name,
          type: file.type,
          data: reader.result.split(',')[1]
        });
        reader.onerror = error => reject(error);
      });
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = "Memproses data...";

      try {
        const fileNoSniEl = document.getElementById('fileNoSni').files[0];
        const fileKemasanEl = document.getElementById('fileKemasan').files[0];

        const fileNoSniBase64 = await fileToBase64(fileNoSniEl);
        const fileKemasanBase64 = await fileToBase64(fileKemasanEl);

        const formData = {
          namaUsaha: document.getElementById('namaUsaha').value,
          namaPemilik: document.getElementById('namaPemilik').value,
          teleponPemilik: document.getElementById('teleponPemilik').value,
          koordinat: document.getElementById('koordinat').value,
          jenisBarang: document.getElementById('jenisBarang').value,
          merkBarang: document.getElementById('merkBarang').value,
          negaraPembuat: document.getElementById('negaraPembuat').value,
          fileNoSni: fileNoSniBase64,
          fileKemasan: fileKemasanBase64
        };

        if (!navigator.onLine) {
          simpanOffline(formData);
          return;
        }

        // Kirim ke Google Apps Script via POST
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(formData)
        });

        const result = await response.json();
        if (result.success) {
          showModal("Berhasil!", "Data pengawasan dan laporan Word berhasil dibuat.");
          document.getElementById('pengawasanForm').reset();
        } else {
          showModal("Gagal Server", result.message);
        }

      } catch (err) {
        // Jika gagal koneksi mendadak, amankan ke offline
        simpanOffline(formData);
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Kirim Data & Buat Laporan Word";
      }
    }

    function simpanOffline(data) {
      let queue = JSON.parse(localStorage.getItem('queue_pengawasan') || '[]');
      queue.push(data);
      localStorage.setItem('queue_pengawasan', JSON.stringify(queue));
      cekDataOffline();
      showModal("Disimpan Offline", "Tidak ada internet. Data diamankan di memori HP dan akan dikirim otomatis saat online.");
      document.getElementById('pengawasanForm').reset();
    }

    async function sinkronisasiDataOtomatis() {
      let queue = JSON.parse(localStorage.getItem('queue_pengawasan') || '[]');
      if (queue.length === 0) return;

      let sisaQueue = [];
      for (let data of queue) {
        try {
          let response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(data)
          });
          let res = await response.json();
          if (!res.success) sisaQueue.push(data);
        } catch (e) {
          sisaQueue.push(data);
        }
      }
      localStorage.setItem('queue_pengawasan', JSON.stringify(sisaQueue));
      cekDataOffline();
    }

    function bukaMenuOffline() {
      let queue = JSON.parse(localStorage.getItem('queue_pengawasan') || '[]');
      if (queue.length > 0 && navigator.onLine) {
        sinkronisasiDataOtomatis().then(() => alert("Sinkronisasi data offline selesai!"));
      } else {
        alert(`Ada ${queue.length} data tersimpan di memori HP. Hubungkan internet lalu ketuk tombol ini untuk menyinkronkan.`);
      }
    }

    function showModal(title, message) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('modalAlert').classList.remove('hidden');
    }

    function tutupModal() {
      document.getElementById('modalAlert').classList.add('hidden');
    }

    // Jalankan cek status saat pertama kali dibuka
    updateOnlineStatus();
  </script>
</body>
</html>
